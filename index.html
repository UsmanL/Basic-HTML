<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <a href="./signup.html">+ Create Account</a>
    <h1>Welcome To My Website</h1>
    <!-- ALT + Shift + F // Format Document -->
    <!-- CTRL + backspace // Tag in html -->
    <form>
      <label for="username">Name *</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="Enter your name"
        required
      />
      <label for="age">Age *</label>
      <input
        type="number"
        id="age"
        name="age"
        placeholder="Enter your age"
        required
      />
      <label for="password">Password *</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        required
      />
      <label for="email">Email *</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
      />
      <label for="resume">Resume *</label>
      <input
        type="file"
        id="resume"
        name="resume"
        placeholder="Upload your resume"
        required
      /><br />
      <label for="color">Color *</label>
      <input
        type="color"
        id="color"
        name="color"
        placeholder="Enter your favorite color"
        required
      />

      <input
        type="date"
        id="date"
        name="date"
        placeholder="Enter your date"
        required
      />
      <input
        type="datetime-local"
        id="datetime"
        name="datetime"
        placeholder="Enter your date and time"
        required
      />
      <input
        type="month"
        id="month"
        name="month"
        placeholder="Enter your month"
        required
      />
      <input
        type="number"
        id="number"
        name="number"
        placeholder="Enter your number"
        required
      />
      <input
        type="checkbox"
        id="range"
        name="range"
        placeholder="Enter your range"
        required
      />
      <input
        type="radio"
        id="radio"
        name="radio"
        placeholder="Enter your radio"
        required
      />

      <label for="select">Select *</label>
      <select id="select" name="select" required>
        <option value="">Select an option</option>
        <option value="option1">LLM</option>
        <option value="option2">Ollama</option>
        <option value="option3">MySQL</option>
      </select>
      <label for="message">Message *</label>
      <textarea
        id="message"
        name="message"
        placeholder="Enter your message"
        required
      ></textarea
      ><br /><br />
      <button type="submit">Submit</button>
    </form>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/djT6-YamHaA?si=H00T1b3SGVCFol-p"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
